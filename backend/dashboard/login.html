<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RestuSec</title>
<link rel="stylesheet" href="static/css/style.css?v=6">
</head>
<body class="login-page">

<div class="login-card">
  <div class="login-logo">
    <img class="logo-img" src="static/img/logo.png" alt="Logo" width="76" height="76">
    <h1>RestuSec</h1>
    <p>Absensi Murid</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Tampilkan sandi">👁</button>
      </div>
    </div>
    <div id="loginError" class="error-msg" style="display:none"></div>
    <button type="submit" class="btn-primary" id="loginBtn">Masuk</button>
  </form>
</div>

<button class="theme-toggle" onclick="toggleTheme()" title="Ganti tema">🌙</button>

<script>
  // Theme
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.querySelector('.theme-toggle').textContent = saved === 'dark' ? '☀️' : '🌙';

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
  }

  function togglePw() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  // ponytail: simpan username+password plaintext di localStorage biar login gampang.
  // Ceiling: siapa pun dengan akses ke laptop ini bisa lihat kredensialnya.
  // Upgrade: pakai sessionStorage (tetap isi manual per buka) atau browser password manager.
  document.getElementById('username').value = localStorage.getItem('savedUser') || '';
  document.getElementById('password').value = localStorage.getItem('savedPass') || '';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    btn.textContent = 'Memuat...';
    btn.disabled = true;
    err.style.display = 'none';

    const form = new FormData();
    form.append('username', document.getElementById('username').value);
    form.append('password', document.getElementById('password').value);

    try {
      const res  = await fetch('/api/login', { method: 'POST', body: form });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('unit',  data.unit);
        localStorage.setItem('username', data.username);
        localStorage.setItem('savedUser', data.username);
        localStorage.setItem('savedPass', document.getElementById('password').value);
        window.location.href = 'index.html';
      } else {
        err.textContent = data.detail || 'Login gagal';
        err.style.display = 'block';
      }
    } catch {
      err.textContent = 'Tidak dapat terhubung ke server';
      err.style.display = 'block';
    } finally {
      btn.textContent = 'Masuk';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
