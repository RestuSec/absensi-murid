<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &mdash; RestuSec</title>
<link rel="stylesheet" href="static/css/style.css?v=16">
</head>
<body class="login-page">

<div class="login-card">
  <div class="login-logo">
    <img class="logo-img" src="static/img/logo.png" alt="Logo RestuSec" width="84" height="84">
    <h1>RestuSec</h1>
    <p>Absensi Murid</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="togglePwBtn" aria-label="Tampilkan sandi">&#128065;</button>
      </div>
    </div>
    <div id="loginError" class="error-msg" style="display:none"></div>
    <button type="submit" class="btn-primary" id="loginBtn">Masuk</button>
  </form>
</div>

<button class="theme-toggle" id="themeToggle" type="button" title="Ganti tema">&#127769;</button>

<script src="static/js/login.js?v=16"></script>
</body>
</html>
